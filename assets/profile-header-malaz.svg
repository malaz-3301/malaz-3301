<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Malaz Ahmad — Backend Developer</title>
  <desc id="desc">Backend developer focused on reliable APIs, data, and backend architecture.</desc>
  <defs>
    <linearGradient id="accent" x1="110" y1="70" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff2d20"/>
      <stop offset="1" stop-color="#f5a400"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 50) rotate(135) scale(510 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f97316" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="26" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="356" rx="25" fill="url(#glow)"/>
  <rect x="2" y="2" width="1196" height="356" rx="25" fill="url(#grid)"/>

  <g transform="translate(72 78)">
    <rect width="126" height="126" rx="28" fill="#111820" stroke="#343c47" stroke-width="2"/>
    <path d="m30 38 31 25-31 25" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 89h28" fill="none" stroke="#f0f6fc" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="236" y="103" fill="#8b949e" font-size="17" font-weight="600" letter-spacing="4">BACKEND DEVELOPER</text>
    <text x="232" y="166" fill="#f0f6fc" font-size="48" font-weight="750">Malaz Ahmad</text>
    <rect x="235" y="190" width="570" height="4" rx="2" fill="url(#accent)"/>
    <text x="235" y="235" fill="#b7c0cb" font-size="22">Reliable APIs · Data · Backend architecture</text>
  </g>

  <g transform="translate(236 273)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <circle cx="9" cy="9" r="12" fill="#2ea043" opacity=".18" filter="url(#soft-glow)"/>
    <circle cx="9" cy="9" r="6" fill="#3fb950"/>
    <text x="30" y="15" fill="#8b949e" font-size="16" font-weight="600" letter-spacing="1.5">OPEN TO BACKEND OPPORTUNITIES</text>
  </g>

  <g transform="translate(900 102)" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace">
    <text x="0" y="0" fill="#f97316" font-size="16">&gt; design.system</text>
    <text x="0" y="34" fill="#8b949e" font-size="15">reliable</text>
    <text x="78" y="34" fill="#484f58" font-size="15">/</text>
    <text x="96" y="34" fill="#8b949e" font-size="15">scalable</text>
    <text x="0" y="84" fill="#f97316" font-size="16">&gt; ship.software</text>
    <text x="0" y="118" fill="#8b949e" font-size="15">clear</text>
    <text x="48" y="118" fill="#484f58" font-size="15">/</text>
    <text x="66" y="118" fill="#8b949e" font-size="15">tested</text>
  </g>

  <circle cx="1128" cy="300" r="42" fill="none" stroke="url(#accent)" stroke-opacity=".35"/>
  <circle cx="1128" cy="300" r="23" fill="none" stroke="url(#accent)" stroke-opacity=".65"/>
  <circle cx="1128" cy="300" r="5" fill="#f97316"/>
</svg>
